<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Leaflet Mappa con Satellite</title>
    <!-- Includi il CSS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
/* Rimuove completamente bordi, sfondi e box-shadow dal contenitore e dalla barra */
.leaflet-bar.leaflet-control-layers,
.leaflet-control-layers {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* Rende il bottone rotondo, grigio chiaro, senza bordi quadrati */
.leaflet-control-layers-toggle {
    border-radius: 50% !important;
    width: 40px;
    height: 40px;
    background-color: #e0e0e0 !important;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) !important;
    background-position: 50% 50% !important;
    border: none !important;
}

/* Rende pulito e con angoli arrotondati il pannello quando si apre */
.leaflet-control-layers-expanded {
    background: #ffffff !important;
    padding: 8px 12px;
    border-radius: 8px !important;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2) !important;
    border: 1px solid #ccc !important;
}    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Includi il JS di Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inizializza la mappa
        var map = L.map('map').setView([41.9028, 12.4964], 6); // Centrata sull'Italia

        // 2. Definisci i singoli layer di tile
        // Layer OpenStreetMap standard
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Layer Satellitare (es. Esri World Imagery)
        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // 3. Aggiungi un layer di default alla mappa (es. OpenStreetMap)
        osmLayer.addTo(map);

        // 4. Crea un oggetto con i layer di base per il controllo
        var baseMaps = {
            "OpenStreetMap": osmLayer,
            "Satellite": satelliteLayer
        };

        // 5. Aggiungi il controllo dei layer alla mappa (in alto a destra)
        L.control.layers(baseMaps).addTo(map);
    </script>

</body>
</html>
