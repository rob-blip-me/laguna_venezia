<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laguna di Venezia – V5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height:100%; margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #map { height:100%; width:100%; }
  #gpsBtn { position:absolute; z-index:1000; top:12px; left:15px; border:0; border-radius:8px; background:white; box-shadow:0 2px 8px rgba(0,0,0,.25); padding:10px 13px; font-size:15px; cursor:pointer; }
  #status { position:absolute; z-index:1000; left:10px; bottom:10px; max-width:calc(100% - 20px); background:rgba(255,255,255,.92); padding:7px 10px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.2); font-size:12px; }
  .depth-legend { line-height:18px; color:#222; background:rgba(255,255,255,.93); padding:7px 9px; border-radius:5px; box-shadow:0 1px 5px rgba(0,0,0,.2); }
  .depth-dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
  .leaflet-popup-content { font-size:13px; }
</style>
</head>
<body>
<div id="map"></div>
<button id="gpsBtn">📍 La mia posizione</button>
<div id="status">Caricamento dati…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { preferCanvas:true }).setView([45.43,12.34], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const channelStyle = {
  color:'#005b96', weight:1.5, opacity:0.85,
  fillColor:'#2b8cbe', fillOpacity:0.22
};
const channelHighlight = {color:'#003f6b', weight:3, fillOpacity:0.35};
const channelsLayer = L.geoJSON(null, {
  style: channelStyle,
  onEachFeature: (feature, layer) => {
    const p = feature.properties || {};
    const speed = (p.speed === null || p.speed === undefined || p.speed === '') ? '—' : p.speed + ' km/h';
    layer.bindPopup(
      '<b>' + esc(p.name || 'Canale') + '</b>' +
      '<br>Velocità: ' + esc(speed) +
      (p.use ? '<br>Uso: ' + esc(p.use) : '') +
      (p.jurisdiction ? '<br>Giurisdizione: ' + esc(p.jurisdiction) : '')
    );
    layer.on({mouseover:e=>e.target.setStyle(channelHighlight), mouseout:e=>channelsLayer.resetStyle(e.target)});
  }
}).addTo(map);

let bathyLayer = L.layerGroup();
let bathyLoaded = false;
let gpsMarker = null, gpsAccuracy = null;

function esc(s){ return String(s).replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c])); }
function depthColor(d){
  // The source values are depths in metres. Larger positive values = deeper.
  if (d < 0.5) return '#d73027';
  if (d < 1) return '#fc8d59';
  if (d < 2) return '#fee08b';
  if (d < 3) return '#d9ef8b';
  if (d < 4) return '#91cf60';
  if (d < 6) return '#1a9850';
  if (d < 10) return '#4575b4';
  return '#313695';
}
function dateText(v){
  if(v === null || v === undefined || v === '') return '—';
  const s=String(v);
  if(/^\\d{8}$/.test(s)) return s.slice(6,8)+'/'+s.slice(4,6)+'/'+s.slice(0,4);
  return s;
}

async function loadData(){
  try {
    const [cr, br] = await Promise.all([fetch('channels.json'), fetch('bathymetry.json')]);
    if(!cr.ok || !br.ok) throw new Error('file dati non raggiungibile');
    const channels = await cr.json();
    const bathy = await br.json();
    channelsLayer.addData(channels);

    // Create bathymetry only once; points are shown from zoom 12 onward for performance.
    bathy.features.forEach(f=>{
      const c=f.geometry.coordinates, p=f.properties||{}, d=Number(p.depth);
      if(!Number.isFinite(d)) return;
      const m=L.circleMarker([c[1],c[0]], {
        renderer:L.canvas(), radius:4, stroke:false, fillOpacity:0.72,
        fillColor:depthColor(d)
      });
      m.bindPopup('<b>Profondità: '+d.toFixed(2)+' m</b><br>Rilievo: '+esc(dateText(p.date))+'<br>Metodo: '+esc(p.method||'—'));
      bathyLayer.addLayer(m);
    });
    bathyLoaded=true;
    updateBathymetryVisibility();
    document.getElementById('status').textContent='Dati caricati: 988 canali + 10.367 punti batimetrici';
  } catch(e) {
    console.error(e);
    document.getElementById('status').textContent='Errore nel caricamento dei dati locali: '+e.message;
  }
}
function updateBathymetryVisibility(){
  if(!bathyLoaded) return;
  if(map.getZoom() >= 12) {
    if(!map.hasLayer(bathyLayer)) bathyLayer.addTo(map);
  } else {
    if(map.hasLayer(bathyLayer)) map.removeLayer(bathyLayer);
  }
}
map.on('zoomend', updateBathymetryVisibility);
loadData();

// Layer control and legend
const overlays = {'Canali lagunari':channelsLayer, 'Punti batimetrici':bathyLayer};
L.control.layers(null, overlays, {collapsed:false, position:'topright'}).addTo(map);
const legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  const div=L.DomUtil.create('div','depth-legend');
  div.innerHTML='<b>Profondità (m)</b><br>'+
    '<span class="depth-dot" style="background:#d73027"></span>&lt;0.5&nbsp;&nbsp;'+
    '<span class="depth-dot" style="background:#fc8d59"></span>0.5–1<br>'+
    '<span class="depth-dot" style="background:#fee08b"></span>1–2&nbsp;&nbsp;'+
    '<span class="depth-dot" style="background:#d9ef8b"></span>2–3<br>'+
    '<span class="depth-dot" style="background:#91cf60"></span>3–4&nbsp;&nbsp;'+
    '<span class="depth-dot" style="background:#1a9850"></span>4–6<br>'+
    '<span class="depth-dot" style="background:#4575b4"></span>6–10&nbsp;&nbsp;'+
    '<span class="depth-dot" style="background:#313695"></span>&gt;10';
  L.DomEvent.disableClickPropagation(div); return div;
};
legend.addTo(map);

// GPS
function showPosition(pos){
  const lat=pos.coords.latitude, lon=pos.coords.longitude, acc=pos.coords.accuracy||0;
  if(!gpsMarker) {
    gpsMarker=L.marker([lat,lon], {title:'La mia posizione'}).addTo(map);
  } else gpsMarker.setLatLng([lat,lon]);
  if(!gpsAccuracy) gpsAccuracy=L.circle([lat,lon], {radius:acc, color:'#3388ff', fillOpacity:.12, weight:1}).addTo(map);
  else {gpsAccuracy.setLatLng([lat,lon]); gpsAccuracy.setRadius(acc);}
  gpsMarker.bindPopup('La tua posizione<br>Precisione: circa '+Math.round(acc)+' m').openPopup();
  map.setView([lat,lon], Math.max(map.getZoom(),14));
  document.getElementById('status').textContent='GPS attivo — precisione circa '+Math.round(acc)+' m';
}
function gpsError(err){ document.getElementById('status').textContent='GPS: '+(err.message||'posizione non disponibile'); }
document.getElementById('gpsBtn').onclick=()=>{
  if(!navigator.geolocation){gpsError({message:'geolocalizzazione non supportata'});return;}
  document.getElementById('status').textContent='Ricerca della posizione…';
  navigator.geolocation.getCurrentPosition(showPosition,gpsError,{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
};
</script>
</body>
</html>
