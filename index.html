<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/fish192.png">
<title>Laguna di Venezia - AVT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
#map{min-height:100vh}
h3{margin:0 0 8px;font-size:17px}
button{padding:7px 10px;border:0;border-radius:7px;margin-top:0px;background: rgba(255,255,255,1);}
#status{display:block;margin-top:8px;color:#555;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>
<div style="position: absolute; top: 12px; left: 50px; z-index: 1000; background: rgba(255,255,255,1); padding: 0px; border-radius: 7px;">
        <!-- <button onclick="locate()">◎ La mia posizione</button> -->
		<button onclick="locate()">📍La mia posizione</button>
    </div>
<span id="status">Caricamento carta GIS…</span>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.16/dist/esri-leaflet.js"></script>
<script>
const status=document.getElementById("status");
const map=L.map("map").setView([45.43,12.34],12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19, attribution:"© OpenStreetMap contributors"
}).addTo(map);

const gisUrl="https://arcgis-prd.comune.venezia.it/server/rest/services/URBANISTICA/VPRG_Laguna_e_Isole_Minori_WGS84/MapServer";

/*
  IMPORTANT:
  We deliberately use the ArcGIS Dynamic Map Service rather than asking the
  browser to download thousands of vector features. The Comune publishes
  this service as a Dynamic MapServer and exposes a proxy for it.
*/
const laguna=L.esri.dynamicMapLayer({
 url:gisUrl,
 opacity:0.75,
 layers:[28,49,51]
}).addTo(map);

/* ---- */
const channelStyle = {
  color:'#64b5f6', weight:1, opacity:0.4,
  fillColor:'#64b5f6', fillOpacity:0.4
};
const channelHighlight = {color:'#42a5f5', weight:2, fillOpacity:0.35};
const channelsLayer = L.geoJSON(null, {
  style: channelStyle,
  onEachFeature: (feature, layer) => {
    const p = feature.properties || {};
    const speed = (p.speed === null || p.speed === undefined || p.speed === '') ? '—' : p.speed + ' km/h';
    layer.bindPopup(
      '<b>' + esc(p.name || 'Canale') + '</b>' +
      '<br>Velocità: ' + esc(speed) +
      (p.use ? '<br>Uso: ' + esc(p.use) : '') +
      (p.jurisdiction ? '<br>Giurisdizione: ' + esc(p.jurisdiction) : '')
    );
    layer.on({mouseover:e=>e.target.setStyle(channelHighlight), mouseout:e=>channelsLayer.resetStyle(e.target)});
  }
}).addTo(map);

/* ---- */
function esc(s){ return String(s).replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c])); }
getText("channels.json");

async function getText(file) {
  let x = await fetch(file);
  let y = await x.json();
  channelsLayer.addData(y);
}

// Briccole: caricamento separato del layer 48
const briccole=L.layerGroup().addTo(map);
fetch(gisUrl+'/48/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson')
 .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
 .then(data=>{
   if(!data.features || !data.features.length) throw new Error('nessun dato restituito');
   L.geoJSON(data,{
     pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,weight:2,fillOpacity:.9}),
     onEachFeature:(f,l)=>{
       const p=f.properties||{};
       const rows=Object.entries(p).filter(([k,v])=>v!==null&&v!=='').slice(0,8);
       l.bindPopup('<b>Briccola</b><br>'+rows.map(([k,v])=>'<b>'+k+'</b>: '+v).join('<br>'));
     }
   }).addTo(briccole);
 });

// Batimetria: layer 49
const batimetria=L.esri.dynamicMapLayer({url:gisUrl,opacity:.75,layers:[49]}).addTo(map);

// Controlli layer
//L.control.layers(null,{
//  'Briccole':briccole,
//  'Batimetria':batimetria,
//  'Carta GIS (canali/limiti)':laguna
	//},{collapsed:false}).addTo(map);


laguna.on("load",()=>{status.textContent="Carta GIS caricata: canali, batimetria e limiti.";});
laguna.on("requesterror",e=>{
 console.error(e);
 status.textContent="Carta GIS non raggiungibile dal browser. La mappa di base resta disponibile.";
});


let marker = null, accuracy = null, watchId = null;
let followUser = true; // Flag per decidere se la mappa deve seguire il GPS

function locate() {
    if (!navigator.geolocation) {
        status.textContent = "Geolocalizzazione non supportata.";
        return;
    }
    
    // Quando l'utente preme il bottone, riattiva il tracciamento forzato e centra la mappa
    followUser = true;
    status.textContent = "Ricerca posizione GPS…";
    
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }
    
    watchId = navigator.geolocation.watchPosition(p => {
        const ll = [p.coords.latitude, p.coords.longitude];
        const a = p.coords.accuracy || 0;
        
        // Sposta la mappa SOLO se l'utente non ha spostato la visuale manualmente
        if (followUser) {
            map.panTo(ll);
        }
        
        // Gestione del marker e del cerchio di precisione
        if (!marker) {
            marker = L.circleMarker(ll, {radius: 8, weight: 3, fillOpacity: 1}).addTo(map);
            
            // Ascolta quando l'utente trascina la mappa con le dita/mouse
            map.on('dragstart', function() {
                followUser = false; // L'utente ha preso il controllo, smettiamo di seguire
            });
        } else {
            marker.setLatLng(ll);
        }
        
        if (!accuracy) {
            accuracy = L.circle(ll, {radius: a, weight: 1, fillOpacity: .08}).addTo(map);
        } else {
            accuracy.setLatLng(ll).setRadius(a);
        }
        
        status.textContent = "Posizione: " + ll[0].toFixed(6) + ", " + ll[1].toFixed(6) + " — ±" + Math.round(a) + " m";
        
    }, e => {
        status.textContent = "GPS: " + e.message;
    }, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    });
}
</script>
</body>
</html>
