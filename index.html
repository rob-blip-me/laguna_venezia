<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="images/fish192.png">
<title>Laguna di Venezia - AVT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;width:100vw;margin:0}
#map{min-height:100vh}
h3{margin:0 0 8px;font-size:17px}
button{padding:7px 10px;border:0;border-radius:7px;background:rgba(255,255,255,1);font-size:14px}
#gpsButton{position:absolute;top:12px;left:50px;z-index:1000}
<!-- #menuButton{position:absolute;top:10px;right:10px;z-index:1000;width:40px;height:40px;padding:0;border:0;border-radius:7px;background:gray;color:white;line-height:40px;align-items:center; justify-content: center;} -->
#menuButton {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1000;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 7px;
  background: gray;
  
  /* 1. Critical Fix: Enable Flexbox centering */
  display: flex;
  align-items: center; 
  justify-content: center;
  
  /* 2. Critical Fix: Remove line-height which causes the shifting */
  line-height: 0; 
}
#poiMenu{display:none;position:absolute;top:60px;right:10px;z-index:1000;background:rgba(240,240,240,1);padding:8px;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.35);width:230px;max-width:calc(100vw - 40px)}
#poiMenuTitle{font-family:Arial,sans-serif;font-size:14px;font-weight:normal;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#resetPOIButton{padding:4px 7px;border:1px solid #aaa;border-radius:5px;background:#fff;color:#333;font-size:12px;white-space:nowrap}
#resetPOIButton:active{background:#ddd}
#poiListContainer{
 max-height:45vh;
 overflow:hidden;
 border:1px solid #bbb;
 border-radius:6px;
 background:rgba(240,240,240,1);
}

#poiList{
 max-height:45vh;
 overflow-y:auto;
 overflow-x:hidden;
 overscroll-behavior:contain;
 -webkit-user-select:none;
 user-select:none;
}
.poiItem{
 display:block;
 width:100%;
 box-sizing:border-box;
 padding:8px 7px;
 margin:0;
 border:0;
 border-bottom:1px solid #ddd;
 border-radius:0;
 background:transparent;
 font-family:Arial,sans-serif;
 font-size:14px;
 font-weight:normal;
 text-align:left;
 color:#222;
 -webkit-appearance:none;
 appearance:none;
 -webkit-tap-highlight-color:transparent;
}
.poiItem:focus{
 outline:none;
 box-shadow:none;
}
.poiItem:last-child{border-bottom:0}
.poiItem:active{background:#ddd}
#poiList::-webkit-scrollbar{
 display:none;
}

#poiList{
 scrollbar-width:none;
 -ms-overflow-style:none;
}
<!--
  #bathymetryLegend{position:absolute;bottom:18px;left:10px;z-index:1000;background:rgba(255,255,255,.88);padding:5px 7px;border-radius:6px;font:11px Arial,sans-serif;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bathymetry-label{
 background:transparent;
 border:0;
 color:#000;
 font:9px Arial,sans-serif;
 font-weight:normal;
 white-space:nowrap;
 text-align:center;
 pointer-events:none;
}
  -->
.menu-icon {
  width: 24px;
  height: 24px;
  fill: #ffffff; /* Inherits the text color of the parent element */
}

.obstacle-icon {
  background: transparent;
  border: 0;
  text-align: center;
}

</style>
</head>
<body>

<div id="map"></div>

<div id="gpsButton">
<button onclick="locate()">📍 La mia posizione</button>
</div>

<!-- <button id="menuButton" onclick="toggleMenu()">☰</button> -->
<button id="menuButton" onclick="toggleMenu()">  <svg viewBox="0 0 24 24" class="menu-icon">
    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
  </svg>
</button>
<div id="poiMenu">
<div id="poiMenuTitle">
 <span>Punti di interesse</span>
<button id="resetPOIButton" type="button" onclick="resetPOI()">Resetta</button>
</div>
<div id="poiListContainer">
    <div id="poiList"></div>
</div>
</div>

<!--
  <div id="bathymetryLegend">Profondità (m) — visibile da zoom 14<br>Briccole — visibili da zoom 14</div>
-->

<script src="https://unpkg.com/esri-leaflet@3.0.16/dist/esri-leaflet.js"></script>

</body>
</html>
